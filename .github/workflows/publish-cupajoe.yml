name: Publish ShorelySafe to Cup A Joe
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    secrets:
      SHORELYSAFE_PUBLISH_TOKEN:
        required: true
  workflow_run:
    workflows: ["Trigger forecast update now", "Trigger observed update now", "Update Highlands Borough forecast", "Update Highlands Borough observed", "pages-build-deployment"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: shorelysafe-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "main"
          path: "sources/Highlands-Borough-floodmapper"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .shorelysafe/
            tools/
            data/
            forecast.json
            forecasts.json
            observed.json
            observedoverflow.json
            toptides.json
            flood_stats.json
          persist-credentials: false
      - name: Publish application files
        working-directory: "sources/Highlands-Borough-floodmapper"
        env:
          SHORELYSAFE_TOKEN: ${{ secrets.SHORELYSAFE_PUBLISH_TOKEN }}
          SHORELYSAFE_SITE: "https://cupajoe.live"
          SHORELYSAFE_APP: "floodmapper--highlands"
        run: python3 .shorelysafe/publish_data_overlay.py --app "$SHORELYSAFE_APP"
      - name: Preserve publication verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highlands-data-publication-receipt
          path: sources/Highlands-Borough-floodmapper/data-overlay-publication-receipt.json
          if-no-files-found: ignore
