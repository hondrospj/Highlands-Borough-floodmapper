name: Historical replay regression
on:
  push:
    paths:
      - index.html
      - assets/highlands-tour.js
      - tools/test_hourly_replay.mjs
      - tools/test_control_ui.mjs
      - tools/test_daily_max.mjs
      - .github/workflows/hourly-replay-regression.yml
  pull_request:
    paths:
      - index.html
      - assets/highlands-tour.js
      - tools/test_hourly_replay.mjs
      - tools/test_control_ui.mjs
      - tools/test_daily_max.mjs
      - .github/workflows/hourly-replay-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hourly-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_hourly_replay.mjs
      - run: node tools/test_control_ui.mjs
      - run: node tools/test_daily_max.mjs
      - run: node --check assets/highlands-tour.js
