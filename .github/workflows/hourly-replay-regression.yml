name: Historical replay regression
on:
  push:
    paths:
      - index.html
      - tools/mapper_test_source.mjs
      - tools/test_hourly_replay.mjs
      - tools/test_control_ui.mjs
      - tools/test_daily_max.mjs
      - .github/workflows/hourly-replay-regression.yml
  pull_request:
    paths:
      - index.html
      - tools/mapper_test_source.mjs
      - tools/test_hourly_replay.mjs
      - tools/test_control_ui.mjs
      - tools/test_daily_max.mjs
      - .github/workflows/hourly-replay-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hourly-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            tools/mapper_test_source.mjs
            tools/test_hourly_replay.mjs
            tools/test_control_ui.mjs
            tools/test_daily_max.mjs
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_hourly_replay.mjs
      - run: node tools/test_control_ui.mjs
      - run: node tools/test_daily_max.mjs
