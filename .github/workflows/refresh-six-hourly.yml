name: Refresh Highlands data every six hours

on:
  schedule:
    - cron: "25 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# This group must differ from the reusable producers' shared lock: the
# coordinator waits for those workflows, so holding their lock would deadlock.
concurrency:
  group: highlands-borough-six-hour-refresh-v1
  cancel-in-progress: false

jobs:
  update-observed:
    uses: ./.github/workflows/update-observed.yml
    with:
      defer_publication: true
    secrets: inherit

  update-forecast:
    needs: update-observed
    uses: ./.github/workflows/update-forecast.yml
    with:
      defer_publication: true
    secrets: inherit

  publish-fresh-data:
    needs: update-forecast
    uses: ./.github/workflows/publish-cupajoe.yml
    secrets: inherit

  publish-github-pages:
    needs: update-forecast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the refreshed mapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate and stage the public mapper
        run: |
          python3 tools/refresh_contract.py --profile mapper --check
          mkdir _site
          cp -a .nojekyll index.html forecast.json observed.json toptides.json \
            petss_station_index.json usgs_crests.json Boundaries assets data _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
